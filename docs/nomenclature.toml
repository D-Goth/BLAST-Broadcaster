[prefixes]
CORE = "Types communs du moteur audio (blast-core)"
DEC = "Décodage, tags et rééchantillonnage (blast-core)"
DSP = "Traitement du signal : filtres, dynamique, chaîne antenne, effets de voix (blast-core)"
MIX = "Mixeur temps réel (blast-core)"
ENG = "Moteur audio et périphériques (blast-core)"
CAST = "Sorties de diffusion, encodage MP3 et fils d'envoi (blast-cast)"
PROT = "Protocoles Icecast / Shoutcast et statistiques (blast-cast)"
AURA = "Pilotage d'OBS par obs-websocket (blast-aura)"
LIB = "Bibliothèque SQLite, historique et règles de séparation (blast-library)"
LIVE = "Chat en direct (blast-live, en préparation)"
CLI = "Outil en ligne de commande « blast » (blast-cli)"
APP = "Démarrage de l'application et commandes Tauri"
CFG = "Réglages enregistrés (config.toml)"
SEC = "Mots de passe dans le trousseau du système"
JRN = "Journal de diagnostic (blast.log)"
UPD = "Vérification des mises à jour sur GitHub"
PL = "Playlist côté application"
THM = "Thèmes de couleurs"
CTL = "Contrôleur : fil central qui relie interface, moteur, diffusion, OBS et bibliothèque"
UI = "Interface : modules JavaScript"
STY = "Interface : feuille de style"
HTM = "Interface : structure de la page"

[codes.CORE-01]
titre = "Identifiant de platine"
definition = "Désigne la platine A ou B ; donne son index, la platine opposée et le côté du crossfader qui la met à l'antenne."

[codes.CORE-02]
titre = "États d'une platine"
definition = "Vide, chargée, en lecture, en pause ou terminée."

[codes.CORE-03]
titre = "Fondu à puissance constante"
definition = "Calcule les gains des platines A et B selon la position du crossfader (loi cosinus / sinus) pour garder un volume perçu stable pendant le fondu."

[codes.DEC-01]
titre = "Titre décodé"
definition = "Échantillons stéréo entrelacés en f32 à la fréquence du moteur, avec titre et artiste lus dans les tags."

[codes.DEC-02]
titre = "Erreurs de décodage"
definition = "Fichier illisible, format non pris en charge, absence de piste audio ou erreur du décodeur."

[codes.DEC-03]
titre = "Année des tags"
definition = "Extrait une année sur quatre chiffres d'un champ de date libre."

[codes.DEC-04]
titre = "Lecture des tags"
definition = "Récupère titre, artiste, album, genre et année dans les métadonnées lues par Symphonia."

[codes.DEC-05]
titre = "Extensions audio reconnues"
definition = "Extensions acceptées dans la playlist, sur les platines et sur les pads."

[codes.DEC-06]
titre = "Filtre des fichiers audio"
definition = "Indique si un chemin porte une extension audio reconnue."

[codes.DEC-07]
titre = "Fiche d'un titre"
definition = "Métadonnées et durée lues sans décoder l'audio, pour la playlist et la bibliothèque."

[codes.DEC-08]
titre = "Ouverture d'un fichier audio"
definition = "Sonde le conteneur et retient la première piste audio décodable."

[codes.DEC-09]
titre = "Rassemblement des tags"
definition = "Fusionne les tags du conteneur et ceux du flux, ces derniers étant prioritaires."

[codes.DEC-10]
titre = "Sonde rapide"
definition = "Lit les tags et la durée d'un fichier sans le décoder entièrement."

[codes.DEC-11]
titre = "Décodage complet"
definition = "Décode un fichier entier en stéréo f32 puis le rééchantillonne à la fréquence du moteur."

[codes.DEC-12]
titre = "Rééchantillonnage"
definition = "Convertit un signal stéréo entrelacé vers une autre fréquence avec un filtre sinc (rubato), par blocs."

[codes.DSP-01]
titre = "Filtre biquad"
definition = "Cellule IIR du second ordre (forme directe transposée II) utilisée par tous les égaliseurs et filtres."

[codes.DSP-02]
titre = "Formules des filtres"
definition = "Coefficients RBJ : passe-haut, passe-bas, cloche, plateaux grave et aigu ; réaccord sans perte d'état et traitement échantillon par échantillon."

[codes.DSP-03]
titre = "Conversion dB vers gain"
definition = "Convertit des décibels en facteur linéaire."

[codes.DSP-04]
titre = "Conversion gain vers dB"
definition = "Convertit un facteur linéaire en décibels, avec un plancher à -120 dB."

[codes.DSP-05]
titre = "Coefficient de lissage"
definition = "Coefficient d'un filtre à un pôle pour un temps d'attaque ou de relâchement donné en millisecondes."

[codes.DSP-06]
titre = "Réglages du compresseur"
definition = "Seuil, taux, largeur du genou, attaque, relâchement et gain de compensation."

[codes.DSP-07]
titre = "Compresseur"
definition = "Compresseur à genou doux sur crête lissée ; renvoie le gain à appliquer et la réduction en cours."

[codes.DSP-08]
titre = "Réglages de l'AGC"
definition = "Niveau cible, gain maximal, vitesses de montée et de descente, seuil de silence."

[codes.DSP-09]
titre = "Contrôle automatique de gain"
definition = "Rapproche lentement le niveau moyen de la cible ; le gain est figé sous le seuil de silence."

[codes.DSP-10]
titre = "Anticipation du limiteur"
definition = "Le limiteur voit le signal 3 ms à l'avance."

[codes.DSP-11]
titre = "Limiteur à anticipation"
definition = "Retarde le signal de 3 ms pour baisser le gain avant la crête : aucun échantillon ne dépasse le plafond."

[codes.DSP-12]
titre = "Réglages du traitement antenne"
definition = "AGC, compresseur, limiteur et activation de la chaîne."

[codes.DSP-13]
titre = "Liste des préréglages antenne"
definition = "Identifiants et libellés : aucun, doux, radio FM, puissant."

[codes.DSP-14]
titre = "Préréglages antenne"
definition = "Construit les réglages de la chaîne antenne à partir d'un identifiant."

[codes.DSP-15]
titre = "Chaîne de traitement antenne"
definition = "AGC, compresseur puis limiteur sur le mélange stéréo, avec la réduction mesurée pour le vumètre RÉD."

[codes.DSP-16]
titre = "Réglages des effets de voix"
definition = "Porte de bruit, filtres, saturation, compresseur, de-esser, souffle et craquements."

[codes.DSP-17]
titre = "Liste des préréglages voix"
definition = "Identifiants et libellés des effets de voix proposés dans Voice FX."

[codes.DSP-18]
titre = "Raccourci de compresseur"
definition = "Construit des réglages de compresseur pour les préréglages de voix."

[codes.DSP-19]
titre = "Préréglages voix"
definition = "Naturel, podcast, radio FM, ASMR, TSF 1930, téléphone et mégaphone."

[codes.DSP-20]
titre = "Boîte d'effets de voix"
definition = "Traite le micro : porte, filtres, saturation tanh ou lampe, compression, de-esser large bande, souffle et craquements simulés."

[codes.MIX-01]
titre = "Polyphonie Sound FX"
definition = "Nombre maximal de sons de pads joués en même temps (16)."

[codes.MIX-02]
titre = "Retard micro maximal"
definition = "Au-delà de 80 ms de son micro en attente, le surplus est jeté pour garder une latence faible."

[codes.MIX-03]
titre = "Réglages du micro"
definition = "Gain, égaliseur trois bandes et passe-haut."

[codes.MIX-04]
titre = "Commandes du mixeur"
definition = "Messages envoyés au fil audio : platines, crossfader, auto-mix, pads, micro, ducking et traitements."

[codes.MIX-05]
titre = "État publié d'une platine"
definition = "État, position et durée en trames, renvoyés à chaque tick."

[codes.MIX-06]
titre = "Événements du mixeur"
definition = "Fin de titre, transition automatique, fin de fondu, fin d'un son de pad et tick de mesure."

[codes.MIX-07]
titre = "Voix Sound FX"
definition = "Son de pad en cours de lecture et sa position."

[codes.MIX-08]
titre = "Chaîne micro"
definition = "File d'entrée, filtres, gain et effets du micro avant le mélange."

[codes.MIX-09]
titre = "Emplacement de platine"
definition = "Titre chargé, position, état et gain d'une platine dans le fil audio."

[codes.MIX-10]
titre = "Fondu en cours"
definition = "Positions de départ et d'arrivée du crossfader et durée du fondu."

[codes.MIX-11]
titre = "Mixeur temps réel"
definition = "Mélange les deux platines, les sons de pads et le micro, sans aucune allocation dans le fil audio."

[codes.MIX-12]
titre = "Application des commandes"
definition = "Exécute une commande de l'interface ; les titres remplacés partent dans une corbeille vidée hors du fil audio."

[codes.MIX-13]
titre = "Rendu simple"
definition = "Produit un bloc de mélange sans séparer antenne et écoute locale."

[codes.MIX-14]
titre = "Rendu antenne et écoute locale"
definition = "Produit le mélange antenne (avec micro) et le mélange local (micro seulement si le retour est activé), applique ducking, auto-mix et traitement antenne."

[codes.MIX-15]
titre = "Traitement du micro"
definition = "Lit le micro dans sa file, limite le retard, filtre et applique les effets de voix."

[codes.ENG-01]
titre = "Tampon de travail"
definition = "Nombre de trames préallouées pour un rappel audio."

[codes.ENG-02]
titre = "Capacité de la prise antenne"
definition = "Secondes de son gardées dans la file vers les encodeurs."

[codes.ENG-03]
titre = "Erreurs du moteur"
definition = "Aucune sortie, périphérique introuvable, format non pris en charge ou erreur du pilote audio."

[codes.ENG-04]
titre = "Conversion d'erreur du pilote"
definition = "Transforme une erreur cpal en erreur du moteur."

[codes.ENG-05]
titre = "Sorties audio"
definition = "Liste les périphériques de sortie du système."

[codes.ENG-06]
titre = "Sortie par défaut"
definition = "Nom de la sortie audio par défaut du système."

[codes.ENG-07]
titre = "Choix du micro"
definition = "Pas de micro, micro par défaut ou micro désigné par son nom."

[codes.ENG-08]
titre = "Entrées audio"
definition = "Liste les micros du système."

[codes.ENG-09]
titre = "Micro par défaut"
definition = "Nom du micro par défaut du système."

[codes.ENG-10]
titre = "Moteur audio"
definition = "Ouvre la sortie et le micro, fait tourner le mixeur dans le rappel audio et expose commandes, événements et prise antenne."

[codes.ENG-11]
titre = "Démarrage du moteur"
definition = "Ouvre la sortie demandée ou celle par défaut, et le micro choisi ; un micro absent n'empêche pas le démarrage."

[codes.ENG-12]
titre = "Lecture des événements"
definition = "Renvoie les événements du mixeur ; le tick passe par un canal séparé qui ne garde que le plus récent."

[codes.ENG-13]
titre = "Prise antenne"
definition = "Vide la file du mélange antenne dans un tampon pour les encodeurs."

[codes.ENG-14]
titre = "Libération différée"
definition = "Libère hors du fil audio les titres retirés par le mixeur."

[codes.ENG-15]
titre = "Éléments du rappel audio"
definition = "Mixeur, files et tampons déplacés dans le rappel de sortie."

[codes.ENG-16]
titre = "Rappel de sortie"
definition = "Construit le flux de sortie pour un format d'échantillon et y fait tourner le mixeur."

[codes.ENG-17]
titre = "Flux micro"
definition = "Flux d'entrée et extrémité de lecture de sa file."

[codes.ENG-18]
titre = "Ouverture du micro"
definition = "Ouvre le micro choisi et relie sa file au mixeur."

[codes.ENG-19]
titre = "Rappel d'entrée"
definition = "Convertit le micro en stéréo f32 et le pousse dans la file sans jamais bloquer."

[codes.CAST-01]
titre = "Débits proposés"
definition = "Débits MP3 proposés dans les réglages d'une sortie."

[codes.CAST-02]
titre = "Codec de diffusion"
definition = "Format envoyé au serveur et son type MIME."

[codes.CAST-03]
titre = "Type de serveur"
definition = "Icecast 2, Shoutcast v1 ou Shoutcast v2."

[codes.CAST-04]
titre = "Sortie de diffusion"
definition = "Serveur, point de montage ou SID, identifiant, débit, canaux et informations de la station, sans mot de passe."

[codes.CAST-05]
titre = "Règles d'une sortie"
definition = "Point de montage normalisé, nombre de canaux et validation des champs avant enregistrement."

[codes.CAST-06]
titre = "Encodeur MP3"
definition = "Encodeur LAME à débit constant, en stéréo ou en mono."

[codes.CAST-07]
titre = "Débit LAME"
definition = "Associe un débit en kb/s à la constante LAME correspondante."

[codes.CAST-08]
titre = "Encodage"
definition = "Convertit un bloc stéréo f32 en trames MP3."

[codes.CAST-09]
titre = "Délai de reconnexion"
definition = "Attente de 5 secondes entre deux tentatives de connexion."

[codes.CAST-10]
titre = "File de son par sortie"
definition = "Nombre de blocs gardés en attente par sortie avant d'en jeter."

[codes.CAST-11]
titre = "État d'une sortie"
definition = "Arrêtée, connexion, en direct, reconnexion (avec la raison) ou erreur."

[codes.CAST-12]
titre = "Changement d'état"
definition = "Identifiant de la sortie et son nouvel état, remontés à l'interface."

[codes.CAST-13]
titre = "Poignée de sortie"
definition = "Canaux de son, de titre et d'arrêt d'un fil d'envoi."

[codes.CAST-14]
titre = "Gestionnaire de diffusion"
definition = "Un fil par sortie ; répartit le son et le titre en cours, collecte les états."

[codes.CAST-15]
titre = "Pilotage des sorties"
definition = "Démarrer, arrêter sans bloquer, pousser le son et le titre, relever les états."

[codes.CAST-16]
titre = "Fil d'envoi"
definition = "Encode et envoie le son d'une sortie, se reconnecte en cas de coupure."

[codes.CAST-17]
titre = "Fin de session d'envoi"
definition = "Arrêt demandé, coupure à retenter ou erreur définitive (mot de passe refusé)."

[codes.CAST-18]
titre = "Boucle d'envoi"
definition = "Connexion, envoi, mise à jour du titre, reconnexion toutes les 5 secondes, arrêt définitif sur mot de passe refusé."

[codes.PROT-01]
titre = "Délai de connexion"
definition = "Temps maximal pour joindre le serveur."

[codes.PROT-02]
titre = "Délai d'échange"
definition = "Temps maximal d'attente d'une réponse ou d'un envoi."

[codes.PROT-03]
titre = "Agent annoncé"
definition = "Nom et version de BLAST annoncés aux serveurs."

[codes.PROT-04]
titre = "Erreurs de diffusion"
definition = "Réseau, authentification refusée, point de montage occupé ou réponse inattendue ; indique si l'erreur est définitive."

[codes.PROT-05]
titre = "Nettoyage d'en-tête"
definition = "Retire retours à la ligne et caractères de contrôle d'une valeur d'en-tête."

[codes.PROT-06]
titre = "Encodage d'URL"
definition = "Encode un texte pour une requête de mise à jour du titre."

[codes.PROT-07]
titre = "Connexion TCP"
definition = "Résout l'adresse et se connecte avec délais."

[codes.PROT-08]
titre = "Lecture d'en-têtes"
definition = "Lit la réponse jusqu'à la fin des en-têtes."

[codes.PROT-09]
titre = "Statut HTTP"
definition = "Extrait le code de la ligne de statut."

[codes.PROT-10]
titre = "Authentification Basic"
definition = "Construit l'en-tête Authorization."

[codes.PROT-11]
titre = "Informations audio"
definition = "Débit, canaux et fréquence annoncés au serveur."

[codes.PROT-12]
titre = "Ouverture de la source"
definition = "Ouvre la connexion source selon le type de serveur."

[codes.PROT-13]
titre = "Source Icecast"
definition = "Requête PUT avec Expect: 100-continue et authentification Basic."

[codes.PROT-14]
titre = "Source Shoutcast"
definition = "Mot de passe sur le port + 1 (v1) ou « motdepasse:#sid » (v2), puis attente de OK2."

[codes.PROT-15]
titre = "Titre en cours"
definition = "Envoie « Artiste - Titre » par /admin/metadata (Icecast) ou /admin.cgi (Shoutcast)."

[codes.PROT-16]
titre = "Auditeurs"
definition = "Nombre d'auditeurs en cours et pic."

[codes.PROT-17]
titre = "Requête de statistiques"
definition = "Requête GET avec authentification vers la page de statistiques."

[codes.PROT-18]
titre = "Lecture JSON minimale"
definition = "Extrait la valeur numérique d'une clé dans une réponse JSON."

[codes.PROT-19]
titre = "Statistiques Icecast"
definition = "Lit status-json.xsl et retient le point de montage de la sortie."

[codes.PROT-20]
titre = "Statistiques Shoutcast v1"
definition = "Lit la page 7.html."

[codes.PROT-21]
titre = "Statistiques Shoutcast v2"
definition = "Lit stats?sid=&json=1."

[codes.PROT-22]
titre = "Relevé des auditeurs"
definition = "Interroge le serveur selon son type et renvoie les auditeurs."

[codes.PROT-23]
titre = "Test de connexion"
definition = "Ouvre une source, envoie un court silence puis referme."

[codes.AURA-01]
titre = "Réglages OBS"
definition = "Adresse, port, connexion au démarrage et source texte « Now Playing »."

[codes.AURA-02]
titre = "Actions OBS élémentaires"
definition = "Changer de scène, lancer ou arrêter stream et enregistrement, afficher une source, écrire un texte."

[codes.AURA-03]
titre = "Informations OBS"
definition = "Versions d'OBS et d'obs-websocket, plateforme."

[codes.AURA-04]
titre = "Erreurs OBS"
definition = "Connexion impossible, authentification refusée ou réponse inattendue."

[codes.AURA-05]
titre = "Authentification obs-websocket"
definition = "SHA-256 du mot de passe et du sel, puis du défi, encodés en base64."

[codes.AURA-06]
titre = "Lecture d'un message"
definition = "Lit le prochain message texte JSON de la WebSocket."

[codes.AURA-07]
titre = "Test de connexion OBS"
definition = "Se connecte, s'authentifie et renvoie les versions."

[codes.AURA-08]
titre = "Abonnement aux événements"
definition = "Masque de tous les événements obs-websocket (2047)."

[codes.AURA-09]
titre = "Sources audio OBS"
definition = "Types de sources traités comme audio."

[codes.AURA-10]
titre = "Commandes OBS"
definition = "Scène, stream, enregistrement, pause, replay, capture, volume, muet, texte et rafraîchissement."

[codes.AURA-11]
titre = "Source audio OBS"
definition = "Nom et type d'une source audio."

[codes.AURA-12]
titre = "Événements OBS"
definition = "Connexion, scènes, stream, enregistrement, sources, volume, informations et erreurs."

[codes.AURA-13]
titre = "Client OBS"
definition = "Fil de connexion persistant, piloté par commandes, qui remonte des événements."

[codes.AURA-14]
titre = "Fin de session OBS"
definition = "Arrêt demandé ou coupure."

[codes.AURA-15]
titre = "Boucle de connexion"
definition = "Se reconnecte avec un délai croissant de 2 à 30 secondes."

[codes.AURA-16]
titre = "Lecture non bloquante"
definition = "Reconnaît une attente sans données sur la socket."

[codes.AURA-17]
titre = "Session OBS"
definition = "État d'une connexion : requêtes en attente par requestId et sources suivies."

[codes.AURA-18]
titre = "Traitement de session"
definition = "Envoi des requêtes, lecture des réponses et des événements, conversion en ObsEvent."

[codes.AURA-19]
titre = "Poignée de main"
definition = "Hello, Identify avec authentification et attente de Identified."

[codes.AURA-20]
titre = "Session complète"
definition = "Ouvre la WebSocket, s'identifie et fait tourner la session."

[codes.LIB-01]
titre = "Version du schéma"
definition = "Numéro de version de la base, enregistré dans la table meta."

[codes.LIB-02]
titre = "Schéma SQLite"
definition = "Tables tracks, historique_diffusion et meta, avec leurs index."

[codes.LIB-03]
titre = "Titre en bibliothèque"
definition = "Chemin, titre, artiste, album, genre, année et durée enregistrés."

[codes.LIB-04]
titre = "Règles de séparation"
definition = "Activation et délais minimaux entre deux passages d'un même artiste ou d'un même titre."

[codes.LIB-05]
titre = "Règle enfreinte"
definition = "Artiste ou titre passé trop récemment, avec le délai restant ; décrite en français pour la playlist."

[codes.LIB-06]
titre = "Ligne d'historique"
definition = "Un passage : début, titre, artiste, durée écoutée, diffusion en direct et auditeurs."

[codes.LIB-07]
titre = "Statistiques"
definition = "Nombre de titres connus et de passages enregistrés."

[codes.LIB-08]
titre = "Bibliothèque"
definition = "Base SQLite en mode WAL : titres connus et historique de diffusion."

[codes.LIB-09]
titre = "Ouverture de la base"
definition = "Ouvre ou crée la base et applique le schéma."

[codes.LIB-10]
titre = "Enregistrement des titres"
definition = "Ajoute ou met à jour les titres scannés."

[codes.LIB-11]
titre = "Début de passage"
definition = "Inscrit un passage dans historique_diffusion et renvoie son identifiant."

[codes.LIB-12]
titre = "Fin de passage"
definition = "Enregistre la durée réellement écoutée."

[codes.LIB-13]
