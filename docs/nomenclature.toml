[codes.CLI-01]
titre = "Arguments"
definition = "Point d'entrée des arguments de la commande blast."

[codes.CLI-02]
titre = "Sous-commandes"
definition = "devices, info, play et render."

[codes.CLI-03]
titre = "Lancement"
definition = "Analyse les arguments et exécute la sous-commande."

[codes.CLI-04]
titre = "Résultat générique"
definition = "Résultat avec erreur quelconque pour la ligne de commande."

[codes.CLI-05]
titre = "Horodatage"
definition = "Formate une durée en minutes et secondes."

[codes.CLI-06]
