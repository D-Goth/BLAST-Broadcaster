[codes.LIB-40]
titre = "Historique pour l'export"
definition = "Lit dans la base tout l'historique d'une période et d'une catégorie, sans limite."

[codes.MIX-16]
titre = "Voix des jingles"
definition = "Les voix numérotées à partir de 1000 sont des jingles : volume propre, arrêt séparé des pads."

[codes.PL-07]
titre = "Normalisation d'un mot"
definition = "Minuscules et accents retirés, pour comparer les noms de dossiers."

[codes.PL-08]
titre = "Mot-clé dans un dossier"
definition = "Le nom de dossier contient-il un des mots-clés, au singulier ou au pluriel ?"

[codes.PL-09]
titre = "Classement d'un fichier"
definition = "Jingle, pub ou morceau d'après le dossier le plus proche qui porte un mot-clé."

[codes.UI-79]
titre = "Bouton de jingle"
definition = "Nom, durée, prêt, en lecture ou en erreur."

[codes.UI-80]
titre = "Affichage de la box à jingles"
definition = "Grille des jingles et nom du dossier."

[codes.UI-81]
titre = "Choix du dossier de jingles"
definition = "Sélecteur de dossier du système."

[codes.UI-82]
titre = "Ligne de l'historique"
definition = "Construit une ligne du filtre choisi à la demande de la liste virtuelle, avec le type du passage."

[codes.UI-83]
titre = "Menu d'export"
definition = "Ouvre le choix de la catégorie et de la période, le mois en cours par défaut."

[codes.UI-84]
titre = "Mots-clés saisis"
definition = "Lit les mots-clés séparés par des virgules."

[codes.APP-33]
titre = "Formats d'image de fond"
definition = "JPEG, PNG, WebP et AVIF."

[codes.APP-34]
titre = "Poids maximal de l'image de fond"
definition = "40 Mo."

[codes.APP-35]
titre = "Vue de l'apparence"
definition = "Réglages du verre dépoli et chemin de l'image de fond copiée."

[codes.APP-36]
titre = "Calcul de la vue d'apparence"
definition = "Lit les réglages et vérifie que l'image de fond existe encore ; gère le dossier de BLAST où l'image est copiée et le ménage des anciennes images."

[codes.APP-37]
titre = "Commande get_appearance"
definition = "Renvoie l'apparence au démarrage de l'interface."

[codes.APP-38]
titre = "Commande save_appearance"
definition = "Enregistre activation, flou, opacité et assombrissement, bornés à des valeurs sûres."

[codes.APP-39]
titre = "Commande set_background"
definition = "Copie l'image choisie dans le dossier de BLAST sous un nom unique, active le verre et supprime l'image précédente."

[codes.APP-40]
titre = "Commande clear_background"
definition = "Retire l'image de fond ; le verre s'affiche alors sur un dégradé du thème."

[codes.CFG-13]
titre = "Réglages d'apparence"
definition = "Verre dépoli activé ou non, flou, opacité des panneaux, assombrissement du fond et image de fond."

[codes.HTM-21]
titre = "Réglages : Apparence"
definition = "Verre dépoli, image de fond et curseurs de flou, d'opacité et d'assombrissement."

[codes.STY-17]
titre = "Verre dépoli"
definition = "Image de fond assombrie sous la page ; panneaux translucides qui floutent ce qui est derrière eux (backdrop-filter)."

[codes.UI-85]
titre = "Couleur translucide"
definition = "Convertit une couleur du thème en couleur avec transparence."

[codes.UI-86]
titre = "Fond du verre"
definition = "Image choisie, servie par le protocole de fichiers de Tauri, ou dégradé aux couleurs du thème."

[codes.UI-87]
titre = "Application de l'apparence"
definition = "Rend translucides les couleurs de fond du thème, règle flou et assombrissement, ou rétablit les couleurs pleines."

[codes.UI-88]
titre = "Réglage en direct"
definition = "Applique chaque mouvement de curseur immédiatement et enregistre 300 ms après le dernier."

[codes.UI-89]
titre = "Choix de l'image de fond"
definition = "Sélecteur d'image du système, puis copie dans le dossier de BLAST."

[codes.APP-41]
titre = "Commande save_library_dirs"
definition = "Enregistre les dossiers de la bibliothèque (vérifiés) ; le contrôleur les relit aussitôt."

[codes.APP-42]
titre = "Commande save_rotation"
definition = "Valide puis enregistre catégories, grilles, planning et grille hors planning."

[codes.APP-43]
titre = "Commande rotation_counts"
definition = "Compte les titres de la bibliothèque qui correspondent à des règles de catégorie, pour l'aperçu en direct."

[codes.CFG-14]
titre = "Réglages de la bibliothèque"
definition = "Dossiers de musique lus pour alimenter les grilles."

[codes.CTL-135]
titre = "Avance de la playlist"
definition = "Avec une grille active, l'auto-mix garde au moins 3 titres d'avance dans la playlist."

[codes.CTL-136]
titre = "Lot de scan"
definition = "Les titres lus sont enregistrés en base par lots de 200."

[codes.CTL-137]
titre = "Tentatives de tirage"
definition = "Nombre de tirages tentés si le fichier choisi a disparu du disque."

[codes.CTL-138]
titre = "État des grilles"
definition = "Grilles, dossiers et titres de la bibliothèque en mémoire, scan en cours, grille et case courantes, tirage aléatoire et avertissements déjà donnés."

[codes.CTL-139]
titre = "Passage d'un titre"
definition = "Met à jour en mémoire la date du dernier passage, pour que la pondération en tienne compte aussitôt."

[codes.CTL-140]
titre = "Scan de la bibliothèque"
definition = "Parcourt les dossiers en arrière-plan et ne relit que les fichiers nouveaux ou modifiés (date de modification)."

[codes.CTL-141]
titre = "Chargement de la bibliothèque"
definition = "Charge en mémoire les titres connus de la base."

[codes.CTL-142]
titre = "Relecture de la bibliothèque"
definition = "Lance un scan des dossiers de la bibliothèque et des playlists M3U des catégories et émissions, sauf s'il en tourne déjà un."

[codes.CTL-143]
titre = "Nouveaux réglages de grilles"
definition = "Applique les grilles (la case courante repart du début) et relit la bibliothèque si ses dossiers changent."

[codes.CTL-144]
titre = "Grille de l'heure"
definition = "Grille du planning pour le jour et l'heure locaux, ou grille hors planning."

[codes.CTL-145]
titre = "Remplissage par la grille"
definition = "Ajoute à la playlist les titres de la grille ou de l'émission de l'heure jusqu'à avoir 3 titres d'avance ; tout repart du début quand l'heure change de contenu."

[codes.CTL-146]
titre = "Tirage dans une catégorie"
definition = "Titres de la catégorie absents de la playlist et des platines, conformes aux règles de séparation (et pas du même artiste qu'un titre déjà prévu), tirés avec pondération ; si aucun n'est conforme, les règles sont assouplies avec un avertissement."

[codes.CTL-147]
titre = "Publication de la bibliothèque"
definition = "Envoie dossiers, nombre de titres et état du scan."

[codes.CTL-148]
titre = "Vue de la grille active"
definition = "Identifiant, nom, couleur de la grille ou de l'émission de l'heure, et s'il s'agit d'une émission."

[codes.CTL-149]
titre = "Vue de la bibliothèque"
definition = "Dossiers, nombre de titres, scan en cours et titres lus."

[codes.CTL-150]
titre = "Règles pour un titre"
definition = "Vérifie un titre décrit par son fichier, son titre, son artiste et son type : platines puis historique ; commun à la playlist et aux grilles."

[codes.DEC-13]
titre = "BPM des tags"
definition = "Lit un tempo entre 20 et 400 BPM dans le champ BPM des tags."

[codes.HTM-22]
titre = "Réglages : Grilles"
definition = "Bibliothèque, catégories, grilles et planning de la semaine."

[codes.LIB-41]
titre = "Titre de la bibliothèque"
definition = "Ce que les grilles savent d'un titre : tags, BPM, durée, type, nombre de passages et dernier passage."

[codes.LIB-42]
titre = "Liste des titres"
definition = "Tous les titres connus de la base, pour les grilles."

[codes.LIB-43]
titre = "Dates de modification"
definition = "Date de modification enregistrée pour chaque fichier, pour ne relire que ce qui a changé."

[codes.LIB-44]
titre = "Taille du planning"
definition = "7 jours de 24 heures."

[codes.LIB-45]
titre = "Plafond d'ancienneté"
definition = "Au-delà d'une semaine sans passage, tous les titres ont le même poids."

[codes.LIB-46]
titre = "Règles d'une catégorie"
definition = "Types, mots de genre, années, BPM, dossiers et playlists M3U ; un critère vide n'impose rien, une année ou un BPM à 0 non plus."

[codes.LIB-47]
titre = "Correspondance"
definition = "Un titre entre dans la catégorie s'il remplit tous les critères renseignés ; sans année ou sans BPM, il ne passe pas un filtre d'année ou de BPM."

[codes.LIB-48]
titre = "Catégorie de grille"
definition = "Nom, couleur et règles."

[codes.LIB-49]
titre = "Grille"
definition = "Nom, couleur et suite ordonnée de catégories, jouée en boucle."

[codes.LIB-50]
titre = "Grilles et planning"
definition = "Catégories, grilles, émissions, contenu de chaque heure de la semaine (grille ou émission) et grille hors planning."

[codes.LIB-51]
titre = "Validation des grilles"
definition = "Noms présents, identifiants uniques, aucune référence à une catégorie ou une grille supprimée."

[codes.LIB-52]
titre = "Contenu d'une heure"
definition = "Grille ou émission du planning pour un jour et une heure, sinon grille hors planning ; une grille sans case est ignorée."

[codes.LIB-53]
titre = "Poids d'un titre"
definition = "Heures écoulées depuis le dernier passage (une semaine au plus), plus un : un titre oublié pèse beaucoup plus qu'un titre récent."

[codes.LIB-54]
titre = "Tirage pondéré"
definition = "Choisit un titre au hasard proportionnellement à son poids."

[codes.PL-10]
titre = "Étiquette de grille"
definition = "Nom et couleur de la catégorie ou de l'émission qui a ajouté un titre ; « fixed » marque un titre d'émission, joué dans l'ordre et exempté des règles de séparation."

[codes.PL-11]
titre = "Date de modification d'un fichier"
definition = "Date de modification en secondes, pour le scan incrémental."

[codes.PL-12]
titre = "Entrée depuis la bibliothèque"
definition = "Construit une entrée de playlist à partir d'un titre de la bibliothèque, sans relire le fichier."

[codes.UI-90]
titre = "Sous-pages des grilles"
definition = "Bascule entre Bibliothèque, Catégories, Grilles et Planning."

[codes.UI-91]
titre = "Affichage de la bibliothèque"
definition = "Dossiers, état du scan et nombre de titres."

[codes.UI-92]
titre = "Liste des catégories"
definition = "Catégories avec leur couleur, et formulaire de celle choisie."

[codes.UI-93]
titre = "Saisie d'une catégorie"
definition = "Lit le formulaire en règles de catégorie, à chaque frappe."

[codes.UI-94]
titre = "Liste des grilles"
definition = "Grilles avec leur couleur et leur nombre de cases."

[codes.UI-95]
titre = "Cases d'une grille"
definition = "Catégorie de chaque case, montée, descente et retrait."

[codes.UI-96]
titre = "Planning"
definition = "Palette des grilles et des émissions (hachurées) et tableau des 7 jours × 24 heures, à peindre au clic ou au glisser."

[codes.UI-97]
titre = "Chargement des grilles"
definition = "Copie de travail des grilles à l'ouverture des réglages."

[codes.UI-98]
titre = "Enregistrement des grilles"
definition = "Envoie la copie de travail ; une erreur de validation s'affiche sans rien perdre."

[codes.UI-99]
titre = "Grille dans le mixeur"
definition = "Affiche le nom et la couleur de la grille ou de l'émission (précédée de ▶) de l'heure à côté du titre MIX."

[codes.PL-13]
titre = "Mélange"
definition = "Mélange de Fisher-Yates de toute la playlist."

[codes.PL-14]
titre = "Mélange en espaçant les artistes"
definition = "Mélange puis regroupe par artiste et pioche à chaque fois dans le plus gros groupe qui n'est pas celui du titre précédent : les titres d'un même artiste sont répartis au plus loin ; les titres sans artiste ne sont pas contraints."

[codes.PL-15]
titre = "Retrait des doublons"
definition = "Retire les entrées dont le fichier, ou le titre et l'artiste (majuscules ignorées), sont déjà présents plus haut ; seules les entrées conservées comptent comme déjà vues."

[codes.CTL-151]
titre = "Mélange de la playlist"
definition = "Mélange simple ou en espaçant les artistes, avec le tirage aléatoire du contrôleur."

[codes.CTL-152]
titre = "Doublons de la playlist"
definition = "Retire les doublons et indique combien ont été retirés."

[codes.UI-100]
titre = "Menu Mélanger"
definition = "Mélanger, mélanger en espaçant les artistes, retirer les doublons."

[codes.HTM-23]
titre = "Menu Mélanger"
definition = "Actions de mélange et de nettoyage de la playlist."

[codes.UI-101]
titre = "Marge de la liste virtuelle"
definition = "Nombre de lignes rendues en plus au-dessus et au-dessous de la zone visible."

[codes.UI-102]
titre = "Liste virtuelle"
definition = "Ne crée que les lignes visibles d'une longue liste ; un espaceur donne la hauteur totale et le rendu suit le défilement."

[codes.UI-103]
titre = "Ligne de la playlist"
definition = "Construit une ligne de la playlist à la demande de la liste virtuelle."

[codes.UI-104]
titre = "Motifs d'attente"
definition = "Applique les motifs d'attente reçus aux entrées et redessine seulement les lignes visibles."

[codes.CTL-153]
titre = "Vue des motifs d'attente"
definition = "Liste compacte (id, motif) des entrées bloquées par les règles de rotation."

[codes.CTL-154]
titre = "Publication des motifs d'attente"
definition = "Émet blast://blocked sans renvoyer toute la playlist."

[codes.PL-16]
titre = "Entrée sauvegardée"
definition = "Forme d'une entrée dans playlist.json : chemin, tags, durée, type et étiquette de grille."

[codes.PL-17]
titre = "Playlist sauvegardée"
definition = "Contenu de playlist.json : version du format, titres des platines en cours, entrées dans l'ordre."

[codes.PL-18]
titre = "Écriture de la playlist"
definition = "Écrit playlist.json dans un fichier temporaire, force l'écriture sur disque puis le renomme."

[codes.PL-19]
titre = "Lecture de la playlist"
definition = "Relit playlist.json sans relire les tags des fichiers."

[codes.CTL-155]
titre = "Délai de sauvegarde"
definition = "Temps maximal entre une modification de la playlist et son écriture sur disque."

[codes.CTL-156]
titre = "Instantané de la playlist"
definition = "Copie des entrées et des titres des platines envoyée au fil de sauvegarde."

[codes.CTL-157]
titre = "État de la sauvegarde"
definition = "Chemin de playlist.json, canal du fil de sauvegarde et heure de la première modification non écrite."

[codes.CTL-158]
titre = "Fil de sauvegarde"
definition = "Écrit le dernier instantané reçu, hors du fil du contrôleur."

[codes.CTL-159]
titre = "Reprise de la playlist"
definition = "Au démarrage, recharge playlist.json : titres des platines en tête, puis la playlist, reclassée selon les catégories."

[codes.CTL-160]
titre = "Prise d'instantané"
definition = "Copie la playlist et les titres en cours sur les platines."

[codes.CTL-161]
titre = "Sauvegarde différée"
definition = "Envoie un instantané au fil de sauvegarde quand le délai est écoulé."

[codes.CTL-162]
titre = "Sauvegarde immédiate"
definition = "Écrit la playlist tout de suite, à la fermeture de l'application."

[codes.APP-44]
titre = "Fermeture"
definition = "À la sortie, demande au contrôleur d'écrire la playlist et attend jusqu'à 5 s."

[codes.PL-20]
titre = "Fichier M3U"
definition = "Reconnaît une playlist .m3u ou .m3u8 à son extension."

[codes.PL-21]
titre = "Lecture d'un M3U"
definition = "Lit les chemins d'une playlist M3U (UTF-8 ou Latin-1, chemins relatifs au fichier, préfixe file://), en ignorant les commentaires et les fichiers non audio."

[codes.PL-22]
titre = "Écriture d'un M3U"
definition = "Écrit la playlist en M3U étendu (#EXTINF : durée, artiste - titre), avec des fins de ligne Windows sous Windows."

[codes.CTL-163]
titre = "Enregistrement en M3U"
definition = "Écrit la playlist dans le fichier M3U choisi et indique le nombre de titres."

[codes.UI-105]
titre = "Enregistrer la playlist"
definition = "Demande l'emplacement du fichier M3U, nommé par défaut avec la date du jour."

[codes.LIB-56]
titre = "Contenu des playlists"
definition = "Pour chaque playlist M3U (clé normalisée), l'ensemble des chemins normalisés qu'elle contient."

[codes.LIB-57]
titre = "Clé de chemin"
definition = "Chemin normalisé pour comparer : barres obliques, minuscules, sans barre finale."

[codes.LIB-58]
titre = "Correspondance avec playlists"
definition = "Applique les règles d'une catégorie, puis exige que le titre figure dans l'une de ses playlists M3U s'il y en a."

[codes.LIB-59]
titre = "Émission"
definition = "Nom, couleur et fichier M3U d'une émission à placer dans le planning."

[codes.LIB-60]
titre = "Contenu programmé"
definition = "Une heure du planning contient une grille ou une émission."

[codes.LIB-61]
titre = "Playlists utilisées"
definition = "Liste sans doublon des fichiers M3U cités par les catégories et les émissions."

[codes.LIB-62]
titre = "Grille hors planning"
definition = "Grille utilisée pour les heures vides du planning et après la fin d'une émission ; ignorée si elle n'a aucune case."

[codes.CTL-164]
titre = "Lecture des playlists de catégories"
definition = "Relit les M3U des catégories pour savoir quels titres de la bibliothèque y figurent."

[codes.CTL-165]
titre = "Début d'émission"
definition = "Lit le M3U de l'émission quand son heure commence ; prévient s'il est vide ou introuvable."

[codes.CTL-166]
titre = "Titre suivant de l'émission"
definition = "Prend le titre suivant du M3U dans l'ordre, en sautant les fichiers absents ; tags de la bibliothèque s'il y est connu."

[codes.CTL-167]
titre = "Fin d'émission"
definition = "Quand le M3U est épuisé, annonce la fin une fois et continue avec la grille hors planning."

[codes.UI-106]
titre = "Liste des émissions"
definition = "Liste des émissions et formulaire de l'émission choisie."

[codes.UI-107]
titre = "Lecture d'une émission"
definition = "Recopie le nom, la couleur et le chemin du M3U depuis le formulaire."

[codes.HTM-24]
titre = "Page Émissions"
definition = "Émissions des grilles : nom, couleur, fichier M3U, explications."

[codes.MIX-17]
titre = "Pas du ducking"
definition = "Variation de gain par échantillon pour que la musique parcoure toute la profondeur du ducking dans le temps réglé (descente ou remontée)."

[codes.HTM-25]
titre = "Réglages repliables du Voice FX"
definition = "Égaliseur micro et temps du ducking ; repliés sur une même ligne, une section ouverte prend toute la largeur."

[codes.ICE-01]
titre = "Erreurs Icecast"
definition = "Serveur injoignable, identifiants admin refusés, statut HTTP inattendu, réponse illisible, action refusée par Icecast ou erreur de fichier, avec un message en français."

[codes.ICE-02]
titre = "Mot de passe aléatoire"
definition = "Caractères alphanumériques sans les signes ambigus (0, O, 1, l, I), tirés par le générateur aléatoire du système."

[codes.ICE-03]
titre = "Limites du serveur"
definition = "Clients, sources, taille de file par auditeur, délais client, en-têtes et source, rafale à la connexion ; valeurs par défaut d'Icecast."

[codes.ICE-04]
titre = "Authentification du serveur"
definition = "Mots de passe des sources et des relais, identifiant et mot de passe admin."

[codes.ICE-05]
titre = "Port d'écoute"
definition = "Port, adresse d'écoute, compatibilité Shoutcast (qui occupe aussi le port suivant) et HTTPS (<ssl> en 2.4, <tls> en 2.5). `key` désigne la balise d'origine pour en garder les options non gérées."

[codes.ICE-06]
titre = "Mountpoint déclaré"
definition = "Nom, identifiant et mot de passe propres, limite d'auditeurs, secours et retour automatique, présentation imposée, annuaire (laisser la source décider, toujours, jamais) et masquage."

[codes.ICE-07]
titre = "Chemins"
definition = "basedir, logdir, webroot, adminroot, fichier PID et certificat TLS (paths/ssl-certificate en 2.4, security/tls-context/tls-certificate en 2.5)."

[codes.ICE-08]
titre = "Journalisation"
definition = "Fichiers d'accès et d'erreurs, niveau de 1 à 4, taille maximale et archivage (balise ajoutée seulement si l'archivage est activé)."

[codes.ICE-09]
titre = "Configuration éditable"
definition = "Partie de icecast.xml présentée dans l'interface : serveur, sécurité, ports, limites, mountpoints, chemins et journaux."

[codes.ICE-10]
titre = "Modèle de configuration neuve"
definition = "icecast.xml minimal : un port 8000, en-tête CORS, alias de la page d'état, chroot désactivé."

[codes.ICE-11]
titre = "Document icecast.xml"
definition = "Arbre XML complet du fichier. Seules les balises gérées sont modifiées : commentaires, relais, authentification des mountpoints, en-têtes et sécurité sont conservés."

[codes.ICE-12]
titre = "Lecture de la configuration"
definition = "Extrait la configuration éditable ; une balise absente prend la valeur par défaut d'Icecast, une limite d'auditeurs négative signifie « sans limite »."

[codes.ICE-13]
titre = "Application de la configuration"
definition = "Réécrit les balises gérées ; une valeur vide retire la balise. Ports et mountpoints sont reconstruits à l'emplacement des anciens, à partir de leur balise d'origine."

[codes.ICE-14]
titre = "Écriture du XML"
definition = "Indentation de quatre espaces, sans déclaration XML, comme le fichier fourni avec Icecast."

[codes.ICE-15]
titre = "Validation"
definition = "Refuse un hostname vide, l'absence de port, un port en double (compatibilité Shoutcast comprise), un mot de passe vide, des limites nulles, un niveau de journal hors de 1 à 4, un mountpoint mal nommé ou en double, un secours qui pointe sur lui-même. Avertit pour un mot de passe « hackme » ou un secours non déclaré."

[codes.ICE-16]
titre = "Chemins absolus"
definition = "Rend webroot, adminroot, basedir et le certificat absolus par rapport au dossier d'installation, et place journaux et fichier PID dans le dossier indiqué. Sert quand la configuration est copiée hors du dossier d'Icecast."

[codes.ICE-17]
titre = "Résolution des chemins"
definition = "Chemin relatif au dossier de travail (ou à basedir), chemin complet d'un journal et premier port d'écoute."

[codes.ICE-18]
titre = "Test d'écriture"
definition = "Ouvre le fichier en ajout sans le modifier, ou crée un fichier témoin dans le dossier s'il n'existe pas encore."

[codes.ICE-19]
titre = "Écriture avec sauvegarde"
definition = "Copie l'ancien fichier en .bak-<horodatage>, écrit un fichier temporaire puis le renomme, et ne garde que les dernières sauvegardes."

[codes.ICE-20]
titre = "Liste des sauvegardes"
definition = "Sauvegardes d'un fichier de configuration, de la plus ancienne à la plus récente."

[codes.ICE-21]
titre = "Statistiques d'un mountpoint"
definition = "Auditeurs, pic, limite, débit, nom, genre, titre en cours (artiste ajouté s'il est séparé), type, adresse et logiciel de la source, début de diffusion, octets envoyés."

[codes.ICE-22]
titre = "Statistiques du serveur"
definition = "Version, hôte, date de lancement, auditeurs, sources, clients, compteurs de connexions et mountpoints actifs."

[codes.ICE-23]
titre = "Auditeur"
definition = "Identifiant Icecast, adresse IP, lecteur utilisé et durée de connexion en secondes."

[codes.ICE-24]
titre = "Lecture des dates"
definition = "Date ISO 8601 d'Icecast (décalage +0100 ou +01:00), sinon format RFC 2822 ; renvoie un horodatage Unix."

[codes.ICE-25]
titre = "Lecture de /admin/stats"
definition = "Transforme la réponse XML des statistiques admin en statistiques du serveur."

[codes.ICE-26]
titre = "Lecture de /admin/listclients"
definition = "Transforme la liste XML des auditeurs d'un mountpoint."

[codes.ICE-27]
titre = "Réponse d'une action admin"
definition = "Lit <iceresponse> : return vaut 1 en cas de succès, sinon le message est renvoyé comme refus."

[codes.ICE-28]
titre = "Actions admin"
definition = "Déconnecter un auditeur, couper une source, déplacer les auditeurs vers un autre mountpoint, changer le titre affiché."

[codes.ICE-29]
titre = "Point d'accès admin"
definition = "Hôte, port, HTTPS, identifiant et mot de passe admin, logiciel annoncé. Une adresse IPv6 est mise entre crochets."

[codes.ICE-30]
titre = "Encodage d'URL"
definition = "Encode un paramètre de requête en pourcentages, « / » compris dans les caractères gardés."

[codes.ICE-31]
titre = "Requête HTTP"
definition = "GET avec authentification Basic, délai de 5 s, certificats du système, 401 ou 403 : identifiants refusés, 400 : message de la page d'erreur d'Icecast, corps limité à 8 Mo."

[codes.ICE-32]
titre = "Sonde"
definition = "Interroge /status-json.xsl sans authentification pour savoir si le serveur répond et lire sa version."

[codes.ICE-33]
titre = "Statistiques admin"
definition = "Lit /admin/stats avec les identifiants admin."

[codes.ICE-34]
titre = "Liste des auditeurs"
definition = "Lit /admin/listclients pour un mountpoint."

[codes.ICE-35]
titre = "Exécution d'une action admin"
definition = "Appelle killclient, killsource, moveclients ou metadata (mode updinfo) et renvoie le message d'Icecast."

[codes.ICE-36]
titre = "Installation détectée"
definition = "Dossier, exécutable, fichier de configuration, dossiers web et admin d'une installation d'Icecast."

[codes.ICE-37]
titre = "Recherche dans un dossier"
definition = "Cherche icecast.exe, icecast2.exe, icecast ou icecast2 à la racine ou dans bin, puis icecast.xml et les dossiers web et admin."

[codes.ICE-38]
titre = "Détection"
definition = "Sous Windows, les dossiers de Program Files dont le nom contient « icecast » ; ailleurs, les paquets icecast2, icecast, /usr/local et Homebrew."

[codes.ICE-39]
titre = "Processus Icecast"
definition = "Lance l'exécutable avec -c dans son dossier de travail, sortie vers console.log, sans fenêtre de console sous Windows ; échec si Icecast s'arrête dans les 1,2 s. Reprend un PID existant. Arrêt par SIGTERM puis arrêt forcé, ou TerminateProcess sous Windows."

[codes.ICE-40]
titre = "Arrêt par PID"
definition = "taskkill /F sous Windows, kill -KILL ailleurs, pour un Icecast lancé lors d'une session précédente de BLAST."

[codes.ICE-41]
titre = "Vérification d'un PID"
definition = "Le nom du processus contient « icecast » (/proc sous Linux, tasklist sous Windows, ps sinon), pour ne jamais arrêter un autre programme qui aurait repris le même numéro."

[codes.ICE-42]
titre = "Fin d'un fichier"
definition = "Dernières lignes d'un journal, en lisant au plus les 256 derniers Ko."

[codes.ICE-43]
titre = "Message d'une page d'erreur"
definition = "Texte d'une page d'erreur HTML d'Icecast, sans le code HTTP placé devant."

[codes.ICM-01]
titre = "Sauvegardes gardées"
definition = "Nombre de copies .bak gardées pour chaque icecast.xml modifié par BLAST."

[codes.ICM-02]
titre = "Gestionnaire des serveurs"
definition = "Processus Icecast suivis par BLAST, dossier de données (PID, console, journaux des copies) et dossier de réglages (copies de icecast.xml)."

[codes.ICM-03]
titre = "Identifiant sûr"
definition = "Lettres, chiffres, tirets et soulignés seulement : l'identifiant sert de nom de dossier."

[codes.ICM-04]
titre = "Dossier de travail"
definition = "Dossier d'installation s'il existe, sinon le dossier de l'exécutable (son parent s'il s'appelle bin). Les chemins relatifs de icecast.xml en partent."

[codes.ICM-05]
titre = "État d'un serveur local"
definition = "En marche et lancé par BLAST ou non ; reprend le processus noté dans icecast.pid après un redémarrage de BLAST."

[codes.ICM-06]
titre = "Lancement"
definition = "Vérifie l'exécutable et la configuration, la valide, crée le dossier des journaux, lance Icecast et note son PID. Refusé pour un serveur distant."

[codes.ICM-07]
titre = "Arrêt"
definition = "Arrête le processus lancé ou repris par BLAST ; un Icecast lancé comme service Windows n'est pas touché."

[codes.ICM-08]
titre = "Arrêt à la fermeture"
definition = "À la fermeture de BLAST, arrête les serveurs locaux réglés ainsi et lancés par BLAST."

[codes.ICM-09]
titre = "Vue d'un serveur"
definition = "Profil, présence d'un mot de passe admin et indication d'une configuration copiée dans BLAST."

[codes.ICM-10]
titre = "Vue de la fenêtre Icecast"
definition = "Serveurs, installations détectées, emplacement des mots de passe et avertissement éventuel."

[codes.ICM-11]
titre = "État renvoyé à l'interface"
definition = "Processus en marche, lancé par BLAST, serveur joignable, version, statistiques et message d'erreur."

[codes.ICM-12]
titre = "Vue de la configuration"
definition = "Configuration, chemin, droit d'écriture, copie gérée par BLAST, nombre de sauvegardes, avertissements et message."

[codes.ICM-13]
titre = "Construction de la vue"
definition = "Assemble la vue de la fenêtre Icecast à partir des réglages et du trousseau."

[codes.ICM-14]
titre = "Construction de la vue de configuration"
definition = "Charge icecast.xml d'un serveur local ; un serveur distant demandera SSH."

[codes.ICM-15]
titre = "Commande ice_list"
definition = "Renvoie la vue de la fenêtre Icecast."

[codes.ICM-16]
titre = "Commande ice_detect"
definition = "Cherche une installation dans un dossier donné, ou aux emplacements habituels."

[codes.ICM-17]
titre = "Commande ice_save_server"
definition = "Valide le profil, crée son identifiant, cherche l'exécutable, reprend port, identifiant et mot de passe admin dans icecast.xml, range le mot de passe dans le trousseau, prévient si l'admin d'un hôte distant passe en HTTP."

[codes.ICM-18]
titre = "Commande ice_delete_server"
definition = "Arrête le serveur s'il a été lancé par BLAST, efface son mot de passe et son profil ; icecast.xml n'est pas supprimé."

[codes.ICM-19]
titre = "Commande ice_status"
definition = "Statistiques admin, sinon sonde publique, avec un message adapté (arrêté, en démarrage, mot de passe manquant ou refusé)."

[codes.ICM-20]
titre = "Commande ice_power"
definition = "Démarre, arrête ou redémarre un serveur local."

[codes.ICM-21]
titre = "Commande ice_get_config"
definition = "Renvoie la vue de la configuration d'un serveur."

[codes.ICM-22]
titre = "Commande ice_save_config"
definition = "Valide, vérifie le droit d'écriture, applique au document, relit le résultat, écrit avec sauvegarde, recopie identifiant, mot de passe admin et port dans le profil, puis redémarre si demandé."

[codes.ICM-23]
titre = "Commande ice_adopt_config"
definition = "Copie icecast.xml dans le dossier de réglages de BLAST avec des chemins absolus, pour le modifier sans droits administrateur ; l'original n'est pas touché."

[codes.ICM-24]
titre = "Commande ice_new_config"
definition = "Crée une configuration neuve à mots de passe aléatoires dans le dossier de réglages de BLAST, avec les pages web et admin de l'installation."

[codes.ICM-25]
titre = "Commande ice_listeners"
definition = "Liste les auditeurs d'un mountpoint."

[codes.ICM-26]
titre = "Commande ice_admin"
definition = "Exécute une action admin et la note dans le journal de BLAST."

[codes.ICM-27]
titre = "Commande ice_log"
definition = "Fin du journal d'erreurs, d'accès ou de la console d'Icecast."

[codes.ICM-28]
titre = "Commande ice_link_output"
definition = "Ajoute dans Diffusion une sortie Icecast vers un mountpoint, avec son mot de passe (propre ou celui des sources) et sa présentation."

[codes.ICM-29]
titre = "Lancement automatique"
definition = "Au démarrage de BLAST, lance dans un fil séparé les serveurs locaux réglés ainsi."

[codes.ICM-30]
titre = "Commande ice_open_web"
definition = "Ouvre la page d'état du serveur dans le navigateur."

[codes.CFG-15]
titre = "Profil d'un serveur Icecast"
definition = "Nom, local ou distant, dossier d'installation, exécutable, fichier de configuration, adresse, port, HTTPS, identifiant admin, lancement au démarrage et arrêt à la fermeture. Le mot de passe admin est dans le trousseau."

[codes.CFG-16]
titre = "Serveurs Icecast"
definition = "Liste des profils de serveurs Icecast."

[codes.SEC-07]
titre = "Clé d'un serveur Icecast"
definition = "Nom du mot de passe admin d'un serveur Icecast dans le trousseau."

[codes.STY-18]
titre = "Onglet Serveur Icecast"
definition = "Mise en page de l'onglet dans les Réglages : liste des serveurs, en-tête, tuiles, graphique, tableaux, formulaires, journal et barre d'enregistrement."

[codes.HTM-26]
titre = "Onglet Serveur Icecast"
definition = "Onglet des Réglages : liste des serveurs à gauche, contenu du serveur choisi à droite."

[codes.HTM-27]
titre = "Accueil Icecast"
definition = "Présentation, installations détectées et ajout d'un serveur local ou distant."

[codes.HTM-28]
titre = "En-tête du serveur"
definition = "État, nom, adresse, version, boutons page web, Redémarrer, Arrêter et Démarrer."

[codes.HTM-29]
titre = "Tableau de bord Icecast"
definition = "Tuiles (auditeurs, pic, sources, durée, débit, connexions), graphique des auditeurs et tableau des mountpoints ; sans flux, explication du point de montage et bouton de sortie vers /live."

[codes.HTM-30]
titre = "Configuration Icecast"
definition = "Fichier, droit d'écriture et formulaire : serveur, sécurité, ports d'écoute, limites, chemins, journalisation."

[codes.HTM-31]
titre = "Mountpoints Icecast"
definition = "Explication (onglet facultatif), liste des mountpoints déclarés et formulaire : accès, secours, présentation, annuaire, sortie BLAST."

[codes.HTM-32]
titre = "Auditeurs Icecast"
definition = "Choix du mountpoint et tableau des auditeurs avec déconnexion."

[codes.HTM-33]
titre = "Journal Icecast"
definition = "Erreurs, accès ou console, suivi en direct."

[codes.HTM-34]
titre = "Connexion Icecast"
definition = "Profil : emplacement, installation, configuration, accès admin et démarrage."

[codes.HTM-35]
titre = "Barre d'enregistrement Icecast"
definition = "Apparaît quand la configuration a changé : annuler, enregistrer, enregistrer et redémarrer."

[codes.HTM-36]
titre = "Menu d'actions Icecast"
definition = "Menu flottant des actions sur un mountpoint."

[codes.UI-108]
titre = "État du module Icecast"
definition = "Serveur choisi, onglet, états et historiques par serveur, configuration chargée et brouillon en cours de modification."

[codes.UI-109]
titre = "Outils de format Icecast"
definition = "Échappement HTML, octets, durées, accès aux champs par chemin (auth.admin_password)."

[codes.UI-110]
titre = "Liste des serveurs"
definition = "Un bouton par serveur avec son état et ses auditeurs."

[codes.UI-111]
titre = "Choix d'un serveur"
definition = "Charge sa configuration si le serveur est local puis son état ; prévient si un brouillon est abandonné."

[codes.UI-112]
titre = "Onglets Icecast"
definition = "Affiche une page ; les onglets réservés aux serveurs locaux sont désactivés pour un serveur distant ou non enregistré."

[codes.UI-113]
titre = "Actualisation de l'état"
definition = "Interroge ice_status, enregistre l'historique des auditeurs et le débit sortant calculé sur 30 s."

[codes.UI-114]
titre = "En-tête Icecast"
definition = "Pastille d'état, adresse, version, origine du processus et boutons selon l'état."

[codes.UI-115]
titre = "Tableau de bord Icecast"
definition = "Bandeau d'information, tuiles et tableau des mountpoints (actifs et déclarés en attente de source)."

[codes.UI-116]
titre = "Graphique des auditeurs"
definition = "Courbe en escalier des 10 dernières minutes, aux couleurs du thème."

[codes.UI-117]
titre = "Actions sur un mountpoint"
definition = "Menu flottant : voir les auditeurs, changer le titre, déplacer les auditeurs, couper la source."

[codes.UI-118]
titre = "Chargement de la configuration"
definition = "Lit icecast.xml et prépare un brouillon modifiable."

[codes.UI-119]
titre = "Formulaire de configuration"
definition = "Remplit les champs data-k depuis le brouillon et les désactive si le fichier est en lecture seule."

[codes.UI-120]
titre = "Ports d'écoute"
definition = "Une ligne par port ; le dernier port ne peut pas être retiré."

[codes.UI-121]
titre = "Mountpoints"
definition = "Liste et formulaire des mountpoints du brouillon."

[codes.UI-122]
titre = "Enregistrement de la configuration"
definition = "Envoie le brouillon, redémarre si demandé et recharge les profils."

[codes.UI-123]
titre = "Liste des auditeurs"
definition = "Auditeurs du mountpoint choisi, du plus ancien au plus récent, avec déconnexion confirmée."

[codes.UI-124]
titre = "Journal"
definition = "Fin du journal choisi, erreurs et avertissements colorés, défilement suivi."

[codes.UI-125]
titre = "Profil du serveur"
definition = "Formulaire de connexion, choix du dossier et du fichier, détection de l'exécutable, avertissement HTTP pour un VPS."

[codes.UI-126]
titre = "Pastille ICECAST"
definition = "Pastille de la barre du haut, retirée : le module vit dans l'onglet Serveur Icecast des Réglages."
retire = true

[codes.UI-127]
titre = "Ouverture de l'onglet Icecast"
definition = "À l'affichage de l'onglet, charge les profils, choisit un serveur et lance les actualisations ; elles s'arrêtent quand on change d'onglet ou qu'on ferme les Réglages."

[codes.UI-128]
titre = "Démarrer, arrêter, redémarrer"
definition = "Commandes du serveur local, avec retour dans une notification."

[codes.UI-129]
titre = "Accueil Icecast"
definition = "Installations détectées pas encore ajoutées."

[codes.ICE-44]
titre = "Format Icecast 2.5"
definition = "Reconnaît un fichier au format 2.5 : bloc security/tls-context, balise <tls> dans un port ou niveau de journal écrit en toutes lettres. La réécriture garde alors ce format."

[codes.ICE-45]
titre = "Niveau de journal"
definition = "Lit le niveau en chiffre (1 à 4, Icecast 2.4) ou en toutes lettres (error, warning, information, debug, Icecast 2.5) ; il est réécrit dans la forme du fichier."

[codes.UI-130]
titre = "Sortie BLAST vers /live"
definition = "Depuis le tableau de bord sans flux en cours, crée en un clic la sortie Icecast vers /live avec le mot de passe des sources."

[codes.UI-131]
titre = "Bouton DIFFUSER"
definition = "Lance ou arrête la diffusion ; sans sortie configurée, prévient au lieu d'ouvrir les Réglages."

[codes.UI-132]
titre = "Détail de la diffusion"
definition = "Panneau ouvert par le « + » du bouton DIFFUSER : état et durée, titre en cours, état et auditeurs de chaque sortie, total et pic, démarrer ou arrêter, accès aux sorties."

[codes.HTM-37]
titre = "Panneau de diffusion"
definition = "Panneau flottant sous le bouton DIFFUSER : en-tête, titre, sorties, total et boutons."

[codes.STY-19]
titre = "Bouton DIFFUSER et son détail"
definition = "Bouton « + » accolé à DIFFUSER et panneau de détail des sorties."

[codes.LIVE-05]
titre = "Événement de chat"
definition = "État de connexion (connecté, écriture possible, détail), message, annonce (abonnement, raid…), effacement des messages d'un viewer ou de tout le chat, suppression d'un message."

[codes.LIVE-06]
titre = "Ligne IRC"
definition = "Tags, préfixe, commande et paramètres d'une ligne du protocole IRC de Twitch."

[codes.LIVE-07]
titre = "Valeur de tag"
definition = "Décode les caractères échappés d'une valeur de tag IRC (\\s pour l'espace, \\: pour le point-virgule…)."

[codes.LIVE-08]
titre = "Lecture d'une ligne IRC"
definition = "Découpe tags, préfixe, commande, paramètres et texte final."

[codes.LIVE-09]
titre = "Rythmes du client Twitch"
definition = "Pause de la boucle, délai minimal entre deux messages envoyés (20 par 30 s), silence maximal avant reconnexion, attente maximale entre deux essais."

[codes.LIVE-10]
titre = "Réglages de connexion Twitch"
definition = "Chaîne, compte et jeton (facultatifs), serveur, port et chiffrement ; l'écriture n'est possible qu'avec un compte et un jeton."

[codes.LIVE-11]
titre = "Nom de chaîne"
definition = "Accepte un nom, #nom ou un lien twitch.tv/… et renvoie le nom en minuscules."

[codes.LIVE-12]
titre = "Transport"
definition = "Connexion TCP non bloquante, chiffrée par rustls (certificat vérifié par le magasin du système) ou en clair pour les tests."

[codes.LIVE-13]
titre = "Fin de session"
definition = "Arrêt demandé, reconnexion demandée par Twitch, connexion perdue ou refus définitif (jeton refusé)."

[codes.LIVE-14]
titre = "Badges"
definition = "Noms des badges d'un message (broadcaster, moderator, vip, subscriber…)."

[codes.LIVE-15]
titre = "Message Twitch"
definition = "Convertit un PRIVMSG en message de chat, avec le nom affiché, la couleur, les badges et les actions /me."

[codes.LIVE-16]
titre = "Session IRC"
definition = "Identification (anonyme justinfan ou compte + jeton), rejoint la chaîne, répond aux PING, traduit les messages, envoie la file d'attente au rythme autorisé et renvoie localement les messages envoyés."

[codes.LIVE-17]
titre = "Boucle de connexion"
definition = "Enchaîne les sessions avec une attente croissante (1 à 30 s) ; s'arrête sur un jeton refusé."

[codes.LIVE-18]
titre = "Client Twitch"
definition = "Fil de connexion, file des messages à envoyer et arrêt propre."

[codes.CTL-168]
titre = "Limites du chat"
definition = "Messages gardés en mémoire, délais entre deux !np et deux !sfx, étiquette et couleur des demandes acceptées."

[codes.CTL-169]
titre = "Demande de titre"
definition = "Viewer, plateforme et source par laquelle répondre, recherche tapée, titre trouvé dans la bibliothèque (ou rien) et heure."

[codes.CTL-170]
titre = "Vue du chat"
definition = "Chaîne Twitch, connexion demandée, état de chaque source (Twitch direct, Social Stream Ninja) et demandes en attente."

[codes.CTL-171]
titre = "État du chat"
definition = "Réglages, clients des deux sources, vue, derniers messages, plateformes vues par Social Stream Ninja, numéros de connexion pour ignorer les événements d'une connexion fermée, délais des commandes."

[codes.CTL-172]
titre = "Texte comparable"
definition = "Minuscules sans accents ni ponctuation, pour comparer une demande aux titres de la bibliothèque."

[codes.CTL-173]
titre = "Recherche d'un titre"
definition = "Chaque mot de la demande doit commencer un mot de « artiste titre » ; un titre ou un artiste exact donne des points ; seuls les morceaux comptent."

[codes.CTL-174]
titre = "Application des réglages du chat"
definition = "Garde les nouveaux réglages et reconnecte si la chaîne, le compte ou les sources actives ont changé."

[codes.CTL-175]
titre = "Connexion au chat"
definition = "Ferme les connexions précédentes et lance chaque source activée : Twitch direct (avec le jeton du trousseau si un compte est indiqué) et Social Stream Ninja (avec l'identifiant de session du trousseau)."

[codes.CTL-176]
titre = "Déconnexion du chat"
definition = "Arrête les sources et publie l'état déconnecté."

[codes.CTL-177]
titre = "Réponse à un viewer"
definition = "Répond par la source d'où vient le message, sur la plateforme du viewer ; si Twitch direct ne peut pas écrire, passe par Social Stream Ninja."

[codes.CTL-178]
titre = "Événement de chat reçu"
definition = "Met à jour l'état de la source, ignore les messages Twitch relayés par Social Stream Ninja quand Twitch direct est actif, tient l'historique, relaie l'événement à l'interface et traite les commandes."

[codes.CTL-179]
titre = "Commandes des viewers"
definition = "!np répond avec le titre à l'antenne (une fois toutes les 15 s), !request crée une demande, !sfx lance le pad du même nom (une fois toutes les 10 s), chacune selon les réglages."

[codes.CTL-180]
titre = "Nouvelle demande"
definition = "Applique la limite de demandes par viewer, cherche le titre, ajoute la demande à la file et répond au viewer."

[codes.CTL-181]
titre = "Demande acceptée"
definition = "Ajoute le titre en tête de playlist, étiqueté « Demande » et exempté des règles de séparation, puis prévient le viewer."

[codes.CTL-182]
titre = "Demande refusée"
definition = "Retire la demande de la file."

[codes.CTL-183]
titre = "Annonce du titre"
definition = "Diffuse « En cours : … » sur toutes les plateformes à chaque nouveau morceau si l'option est active."

[codes.CTL-184]
titre = "Publication du chat"
definition = "Envoie à l'interface l'état du chat et, au démarrage de l'interface, les derniers messages."

[codes.APP-45]
titre = "Enregistrement du chat"
definition = "Enregistre les réglages du chat ; le jeton Twitch et l'identifiant de session Social Stream Ninja vont au trousseau ; refuse d'activer Social Stream Ninja sans identifiant."

[codes.CFG-17]
titre = "Réglages du chat"
definition = "Sources actives (Twitch direct, Social Stream Ninja), chaîne, compte qui écrit, connexion au démarrage, annonce des titres, commandes actives et limite de demandes par viewer."

[codes.SEC-08]
titre = "Clé du jeton Twitch"
definition = "Nom de l'entrée du trousseau qui garde le jeton du chat."

[codes.HTM-38]
titre = "Onglet CHAT"
definition = "Messages, champ d'envoi et file des demandes, à côté de la playlist et de l'historique."

[codes.HTM-39]
titre = "Réglages du chat"
definition = "Sources (Twitch direct : chaîne, compte, jeton ; Social Stream Ninja : identifiant de session), connexion au démarrage, commandes des viewers."

[codes.STY-20]
titre = "Chat"
definition = "Pastille de messages non lus, état, messages, plateformes, badges, dons, annonces, champ d'envoi et cartes de demandes."

[codes.UI-133]
titre = "Affichage du chat"
definition = "Messages gardés, badges affichés et couleurs des viewers sans couleur choisie."

[codes.UI-134]
titre = "Couleur d'un viewer"
definition = "Couleur choisie sur Twitch, sinon une couleur stable tirée de son identifiant."

[codes.UI-135]
titre = "Ligne du chat"
definition = "Heure, plateforme (si Social Stream Ninja est actif), badges, nom en couleur et texte ; commandes surlignées, actions en italique, dons et annonces encadrés."

[codes.UI-136]
titre = "File des demandes"
definition = "Cartes des demandes : viewer, heure, titre trouvé ou recherche introuvable, Jouer ensuite et Refuser."

[codes.UI-137]
titre = "État du chat"
definition = "Pastille et état de chaque source, bouton Connecter/Déconnecter, champ d'envoi actif si au moins une source peut écrire."

[codes.UI-138]
titre = "Valeurs du chat"
definition = "Lit le formulaire des réglages du chat, avec le jeton saisi ou l'oubli du jeton."

[codes.CTL-185]
titre = "Source de chat"
definition = "Twitch direct ou Social Stream Ninja ; chaque événement reçu indique sa source."

[codes.CTL-186]
titre = "État d'une source"
definition = "Activée, lancée, connectée, écriture possible et détail."

[codes.CTL-187]
titre = "Message à tout le chat"
definition = "Envoie un message sur toutes les plateformes, une seule fois chacune : Twitch par Twitch direct s'il peut écrire, les autres plateformes vues par Social Stream Ninja une par une, ou toutes d'un coup sans Twitch direct."

[codes.LIVE-19]
titre = "Connexion chiffrée"
definition = "Configuration rustls avec vérification du certificat par le magasin du système, partagée par les clients Twitch et Social Stream Ninja."

[codes.LIVE-20]
titre = "Rythmes du client Social Stream Ninja"
definition = "Pause de la boucle, ping toutes les 30 s, attente maximale entre deux essais, canal des messages de chat (4) et canal des commandes (1)."

[codes.LIVE-21]
titre = "Réglages de connexion Social Stream Ninja"
definition = "Identifiant de session, serveur, port et chiffrement ; adresse /join/SESSION/4/1."

[codes.LIVE-22]
titre = "Identifiant de session"
definition = "Accepte l'identifiant seul ou un lien contenant session=… et renvoie l'identifiant."

[codes.LIVE-23]
titre = "Flux réseau"
definition = "Connexion en clair (tests) ou chiffrée, lue et écrite par le WebSocket."

[codes.LIVE-24]
titre = "Ouverture du WebSocket"
definition = "Connexion, chiffrement, poignée de main WebSocket bloquante avec délai, puis passage en mode non bloquant."

[codes.LIVE-25]
titre = "Texte sans HTML"
definition = "Retire les balises d'un message, remplace les émoticônes par leur texte alternatif et décode les entités."

[codes.LIVE-26]
titre = "Message Social Stream Ninja"
definition = "Convertit l'objet JSON reçu (chatname, chatmessage, type, nameColor, moderator, membership, hasDonation, event…) en message ou en annonce."

[codes.LIVE-27]
titre = "Commande d'envoi"
definition = "Construit {action: sendChat, value, target} pour écrire sur une plateforme, ou sur toutes sans target."

[codes.LIVE-28]
titre = "Session Social Stream Ninja"
definition = "Lit les messages, envoie les commandes en attente, ping régulier ; un envoi qui bloquerait est gardé en file."

[codes.LIVE-29]
titre = "Boucle de connexion Social Stream Ninja"
definition = "Enchaîne les sessions avec une attente croissante (1 à 30 s)."

[codes.LIVE-30]
titre = "Client Social Stream Ninja"
definition = "Fil de connexion, file des messages à envoyer avec leur plateforme et arrêt propre."

[codes.SEC-09]
titre = "Clé de la session Social Stream Ninja"
definition = "Nom de l'entrée du trousseau qui garde l'identifiant de session : il permet d'écrire dans tes chats, il est donc traité comme un secret."

[codes.CTL-188]
titre = "Volume des platines"
definition = "Applique le volume de chaque platine en dB (de -60, coupé, à +6) quand il change, à la reprise des réglages comme pendant un glissement du curseur."

[codes.CTL-189]
titre = "Plage du volume des platines"
definition = "Volume minimal (-60 dB, platine coupée) et maximal (+6 dB) d'une platine."

[codes.APP-46]
titre = "Enregistrement du volume des platines"
definition = "Garde le volume des deux platines dans les réglages, arrondi au demi-décibel, quand le curseur est relâché."

[codes.HTM-40]
titre = "Volume et niveau de la platine A"
definition = "Curseur VOL, valeur en dB et VU-mètre gauche/droite de la platine A."

[codes.HTM-41]
titre = "Volume et niveau de la platine B"
definition = "Curseur VOL, valeur en dB et VU-mètre gauche/droite de la platine B."

[codes.STY-21]
titre = "Volume et niveau des platines"
definition = "Ligne VOL sous les boutons d'une platine : curseur à la couleur de la platine, valeur et VU-mètre fin."

[codes.UI-139]
titre = "État des niveaux des platines"
definition = "Retombée des VU-mètres de chaque platine, curseur en cours de glissement et affichage du volume en dB (−∞ en bas de course)."

[codes.UI-140]
titre = "Niveau d'une platine"
definition = "Met à jour le VU-mètre de la platine et, hors glissement, le curseur et la valeur du volume."

[codes.UI-141]
titre = "Enregistrement des volumes"
definition = "Envoie les volumes des deux platines aux réglages."

[codes.DEC-14]
titre = "Format audio d'un titre"
definition = "Codec, fréquence d'origine, nombre de canaux, résolution (formats sans perte) et débit moyen calculé depuis la taille du fichier, pochette intégrée déduite."

[codes.DEC-15]
titre = "Pochette"
definition = "Image (type MIME + octets) intégrée au fichier ou trouvée dans son dossier."

[codes.DEC-16]
titre = "Limites de pochette"
definition = "Taille maximale acceptée (8 Mo) et noms de fichiers reconnus comme pochette de dossier, par ordre de préférence."

[codes.DEC-17]
titre = "Pochette de dossier"
definition = "Cherche cover/folder/front/album/albumart en .jpg, .jpeg, .png ou .webp à côté du titre, sans tenir compte de la casse."

[codes.DEC-18]
titre = "Nom du codec"
definition = "Nom court lisible du codec (MP3, FLAC, AAC, Vorbis, Opus ; PCM pour tous les WAV/AIFF non compressés)."

[codes.CTL-190]
titre = "Libellé du format"
definition = "Texte affiché sous la platine : codec · bits · kHz · kbps · mono/stéréo."

[codes.APP-47]
titre = "Pochette d'une platine"
definition = "Commande deck_cover : demande au contrôleur la pochette chargée et la renvoie en binaire brut (vide s'il n'y en a pas)."

[codes.HTM-42]
titre = "Identité de la platine A"
definition = "Pochette, titre, artiste et format du titre chargé sur la platine A."

[codes.HTM-43]
titre = "Identité de la platine B"
definition = "Pochette, titre, artiste et format du titre chargé sur la platine B."

[codes.STY-22]
titre = "Pochette et format des platines"
definition = "Vignette 60 px avec note de remplacement, ligne de format en police fixe, agrandissement plein écran."

[codes.UI-142]
titre = "État des pochettes affichées"
definition = "Identifiant de pochette affiché et URL blob en cours, par platine."

[codes.UI-143]
titre = "Affichage de la pochette"
definition = "Ne redemande la pochette que si son identifiant change ; libère l'ancienne URL blob."

[codes.UI-144]
titre = "Agrandissement de la pochette"
definition = "Clic sur la vignette : pochette en grand ; clic ou Échap pour fermer."

[codes.MIX-18]
titre = "Plage de vitesse d'une platine"
definition = "Vitesse de lecture acceptée par le mixeur, de ×0,5 à ×2 ; une valeur invalide revient à ×1."

[codes.MIX-19]
titre = "Temps restant à la vitesse courante"
definition = "Frames de sortie restantes, vitesse comprise ; sert au déclenchement de l'auto-mix."

[codes.MIX-20]
titre = "Lecture à vitesse variable"
definition = "Interpolation linéaire entre deux échantillons et avance fractionnaire de la tête de lecture."

[codes.CTL-191]
titre = "Pitch d'une platine"
definition = "Borne le pitch à ±16 %, l'arrondit au dixième et envoie la vitesse au mixeur s'il a changé."

[codes.CTL-192]
titre = "Pitch maximal"
definition = "Écart maximal de vitesse autorisé depuis l'interface (±16 %)."

[codes.HTM-44]
titre = "Pitch de la platine A"
definition = "Curseur PITCH (−16 à +16 %) et valeur cliquable pour revenir à 0 %."

[codes.HTM-45]
titre = "Pitch de la platine B"
definition = "Curseur PITCH (−16 à +16 %) et valeur cliquable pour revenir à 0 %."

[codes.STY-23]
titre = "Pitch des platines"
definition = "Curseur aligné à droite des boutons ; valeur encadrée en orange quand le pitch n'est pas à 0 %."

[codes.UI-145]
titre = "État du pitch"
definition = "Curseur tenu et format du pourcentage (virgule, signe moins typographique)."

[codes.UI-146]
titre = "Affichage du pitch"
definition = "Met à jour le curseur et la valeur depuis l'état, sauf pendant que l'utilisateur le tient."

[codes.UI-147]
titre = "Commandes du pitch"
definition = "Glisser envoie le pitch ; double-clic sur le curseur ou clic sur la valeur le remet à 0 %."
