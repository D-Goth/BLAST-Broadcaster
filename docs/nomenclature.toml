[codes.LIB-14]
titre = "Derniers passages"
definition = "Renvoie les passages les plus récents."

[codes.LIB-15]
titre = "Passages sur une période"
definition = "Renvoie les passages entre deux instants."

[codes.LIB-16]
titre = "Purge"
definition = "Supprime les passages plus anciens qu'une date."

[codes.LIB-17]
titre = "Effacement"
definition = "Vide tout l'historique."

[codes.LIB-18]
titre = "Calcul des statistiques"
definition = "Compte les titres et les passages."

[codes.LIB-19]
titre = "Champ CSV"
definition = "Met un champ entre guillemets si nécessaire."

[codes.LIB-20]
titre = "Export CSV"
definition = "Produit l'historique au format CSV avec des dates lisibles."

[codes.LIVE-01]
titre = "Plateforme de chat"
definition = "Twitch, YouTube ou Kick."

[codes.LIVE-02]
titre = "Message de chat"
definition = "Plateforme, auteur et texte."

[codes.LIVE-03]
titre = "Commande de chat"
definition = "Demande de titre, titre en cours ou déclenchement d'un son."

[codes.LIVE-04]
