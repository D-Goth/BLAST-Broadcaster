[package]
name = "blast-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "blast-broadcaster"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blast-core = { path = "../../crates/blast-core" }
blast-cast = { path = "../../crates/blast-cast" }
blast-aura = { path = "../../crates/blast-aura" }
blast-live = { path = "../../crates/blast-live" }
blast-library = { path = "../../crates/blast-library" }
blast-ice = { path = "../../crates/blast-ice" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossbeam-channel = "0.5"
open = "5"
ureq = { version = "3", features = ["json", "platform-verifier"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
tauri-plugin-updater = "2"
